[build]
builder = "RAILPACK"
buildCommand = "pnpm -F web build"
watchPatterns = [
  "apps/web/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json",
]

[deploy]
startCommand = "pnpm -F web start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
