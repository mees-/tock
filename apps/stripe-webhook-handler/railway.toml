[build]
builder = "RAILPACK"
watchPatterns = [
  "apps/stripe-webhook-handler/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json",
]
buildCommand = "echo NO_BUILD"

[deploy]
startCommand = "bun apps/stripe-webhook-handler/src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
