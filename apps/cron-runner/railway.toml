[build]
builder = "RAILPACK"
watchPatterns = [
  "apps/cron-runner/**",
  "packages/database/**",
  "packages/auth/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.base.json",
]
buildCommand = "echo NO_BUILD"

[deploy]
startCommand = "bun apps/cron-runner/src/index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
